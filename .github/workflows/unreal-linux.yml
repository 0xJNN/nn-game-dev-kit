name: Unreal Linux native gates (manual licensed runner)

on:
  workflow_dispatch:

permissions:
  contents: read

# Never expose a licensed/self-hosted engine runner to arbitrary pull requests.
jobs:
  native:
    runs-on: [self-hosted, linux, x64, novanode-unreal]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      # UE_ROOT is supplied by the authorized runner environment, not a bundled engine download.
      - run: python studio.py unreal build --execute
      - run: python studio.py unreal prepare --execute
      - run: python studio.py unreal test --execute
      - run: python studio.py unreal package --execute
      - run: python studio.py unreal smoke --execute
      - name: Archive allowlisted internal evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unreal-linux-${{ github.sha }}
          include-hidden-files: true
          path: |
            .studio/evidence/unreal-*.log
            .studio/evidence/unreal-*.json
            .studio/evidence/unreal-automation/
          retention-days: 7
